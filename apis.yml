aid: myrtelle
name: Myrtelle
description: 'Myrtelle, Inc. is a clinical-stage biotechnology company headquartered in Wakefield,
  Massachusetts, developing gene therapies for myelin-based disorders of the central nervous system.
  Its lead program, MYR-101 (rAAV-Olig001-ASPA), is a first-in-class oligotrophic recombinant
  adeno-associated virus gene therapy for Canavan disease, a rare and fatal childhood genetic brain
  disease caused by mutations in the ASPA gene. The program is licensed exclusively worldwide from
  Pfizer Inc., holds Orphan Drug, Fast Track and Rare Pediatric Disease designations in the US with
  similar designations in Europe, and has reported Phase 1/2 interim results in Nature Medicine.
  Myrtelle is a therapeutics developer, not a software company: it publishes no developer program,
  API, SDK or machine-readable API contract, and is profiled here for network completeness only.'
